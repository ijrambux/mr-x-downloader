<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. X — Professional Media Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tech-bg"></div>

    <div class="container">

        <!-- الشريط العلوي -->
        <div class="top-bar">
            <a href="https://x.com/DouglasChav3s" target="_blank" class="x-btn" title="Follow on X">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
                <span data-i18n="follow">تابعني على X</span>
            </a>

            <div class="right-controls">
                <div class="quota-badge" id="quotaBadge" title="التحميلات المتبقية اليوم">
                    <span class="quota-dot"></span>
                    <span id="quotaText">5/5</span>
                </div>
                <button id="langToggle" class="lang-btn">
                    <span class="lang-current">🇬🇧 English</span>
                </button>
            </div>
        </div>

        <!-- الشعار -->
        <header class="hero">
            <div class="shield">
                <svg viewBox="0 0 200 220" class="panther-logo">
                    <defs>
                        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#4fc3f7"/>
                            <stop offset="100%" stop-color="#0d47a1"/>
                        </linearGradient>
                        <linearGradient id="pantherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1a1a2e"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </linearGradient>
                    </defs>
                    <path d="M100 10 L190 50 L190 130 Q190 190 100 210 Q10 190 10 130 L10 50 Z"
                          fill="url(#pantherGrad)" stroke="url(#shieldGrad)" stroke-width="3"/>
                    <path d="M60 80 L80 60 L100 75 L120 60 L140 80 L135 110 L120 130 L100 145 L80 130 L65 110 Z"
                          fill="url(#pantherGrad)" stroke="#4fc3f7" stroke-width="2"/>
                    <polygon points="75,95 90,100 75,105" fill="#00e5ff"/>
                    <polygon points="125,95 110,100 125,105" fill="#00e5ff"/>
                </svg>
            </div>
            <h1 class="brand">Mr.<span>X</span></h1>
            <p class="tagline" data-i18n="tagline">محمّل الوسائط  — يدعم +1000 موقع</p>
        </header>

        <!-- صندوق الإدخال -->
        <section class="input-section">
            <textarea id="urlInput" data-i18n-placeholder="inputPlaceholder"
                      placeholder="الصق رابطاً واحداً أو أكثر (سطر لكل رابط)..."></textarea>
            <div class="options">
                <div class="format-toggle">
                    <button class="fmt-btn active" data-format="mp4">🎬 MP4</button>
                    <button class="fmt-btn" data-format="mp3">🎵 MP3</button>
                </div>
                <button id="fetchBtn" class="primary-btn">
                    <span data-i18n="fetchBtn">🔍 جلب المعلومات</span>
                </button>
            </div>
        </section>

        <!-- النتائج -->
        <section id="results" class="results"></section>

        <footer class="footer">
            <p data-i18n="footer">© 2026 Mr. X — </p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
